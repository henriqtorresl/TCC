services:
  postgres:
    image: postgres:16-alpine
    container_name: medico_digital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medico_digital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - medico_digital_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medico_digital"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medico_digital_pg_data:
