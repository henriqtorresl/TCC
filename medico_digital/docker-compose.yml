services:
  postgres:
    image: postgres:16-alpine
    container_name: medico_digital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medico_digital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
