name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: medico_digital/package-lock.json

      - name: Install dependencies
        working-directory: medico_digital
        run: npm ci

      - name: Lint
        working-directory: medico_digital
        run: npm run lint

      - name: Test
        working-directory: medico_digital
        run: npm test

      - name: Build
        working-directory: medico_digital
        run: npm run build
